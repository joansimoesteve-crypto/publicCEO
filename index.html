<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar IA</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="scene">

    <div id="aura"></div>

    <div id="avatar">

        <img id="body"
             src="avatar.png"
             alt="Avatar">

        <div class="eye left">
            <div class="eyelid"></div>
        </div>

        <div class="eye right">
            <div class="eyelid"></div>
        </div>

        <div id="mouth"></div>

    </div>

</div>

<div id="speech">
    Hola. Soy tu asistente virtual.
</div>

<script src="avatar.js"></script>

</body>
</html>
