<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PublicCEO</title>

    <link rel="stylesheet" href="style.css">

    2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<div class="container">

    <section class="avatar-section">

        <div class="avatar-card">

            <img
                src="avatar.png"
                alt="PublicCEO"
                draggable="false"
            >

            <div class="wave">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </section>

    <aside class="panel">

        <h1>👋 PublicCEO</h1>

        <p>
            Soy tu asistente virtual.
            ¿Cómo puedo ayudarte hoy?
        </p>

        <div id="messages"></div>

    </aside>

</div>

<div class="chatbar">

    <input
        id="prompt"
        type="text"
        placeholder="Escribe tu mensaje..."
    >

    <button id="mic">🎤</button>

    <button id="send">➜</button>

</div>

<script src="main.js"></script>

</body>
</html>
